<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>L & E Construction Group</title>
    <style>
      @font-face {
        font-family: "Fraunces";
        src: url("fonts/Fraunces.ttf") format("truetype");
        font-weight: 100 900;
        font-style: normal;
        font-display: block;
      }
      @font-face {
        font-family: "Figtree";
        src: url("fonts/Figtree.woff2") format("woff2"),
          url("fonts/Figtree.ttf") format("truetype");
        font-weight: 100 900;
        font-style: normal;
        font-display: block;
      }
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      html,
      body {
        width: 1200px;
        height: 630px;
        overflow: hidden;
        background: #1a1714;
      }
      .card {
        position: relative;
        width: 1200px;
        height: 630px;
        overflow: hidden;
      }
      .photo {
        position: absolute;
        inset: 0;
        background: #1a1714 url("og-bg.jpg") center 58% / cover no-repeat;
      }
      .scrim {
        position: absolute;
        inset: 0;
        background:
          radial-gradient(
            ellipse 78% 72% at 50% 48%,
            rgba(20, 18, 16, 0.58) 0%,
            rgba(20, 18, 16, 0.34) 58%,
            rgba(20, 18, 16, 0.22) 100%
          ),
          linear-gradient(
            180deg,
            rgba(20, 18, 16, 0.28) 0%,
            rgba(20, 18, 16, 0.12) 38%,
            rgba(20, 18, 16, 0.42) 100%
          );
      }
      .lockup {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: 84px 180px;
        color: #f3eee4;
      }
      .mark {
        width: 42px;
        height: 42px;
        margin-bottom: 22px;
      }
      .name {
        font-family: "Fraunces", "Times New Roman", serif;
        font-optical-sizing: auto;
        font-weight: 540;
        font-size: 92px;
        line-height: 0.92;
        letter-spacing: -0.035em;
        color: #f3eee4;
        text-wrap: balance;
      }
      .name .amp {
        color: #1cb8b2;
        font-weight: 500;
        padding: 0 0.06em;
      }
      .company {
        margin-top: 10px;
        font-family: "Fraunces", "Times New Roman", serif;
        font-optical-sizing: auto;
        font-weight: 500;
        font-size: 38px;
        line-height: 1.05;
        letter-spacing: -0.02em;
        color: #f3eee4;
      }
      .rule {
        width: 72px;
        height: 2px;
        margin: 26px 0 18px;
        background: #2f8b88;
      }
      .tag {
        font-family: "Figtree", "Segoe UI", sans-serif;
        font-weight: 600;
        font-size: 16px;
        letter-spacing: 0.28em;
        text-transform: uppercase;
        color: #f3eee4;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="photo"></div>
      <div class="scrim"></div>
      <div class="lockup">
        <svg class="mark" viewBox="0 0 32 32" aria-hidden="true">
          <rect width="32" height="32" rx="7" fill="#f3eee4" />
          <path fill="#2f8b88" d="M5.5 7.5h4.6v12.2h6.2V24.5H5.5z" />
          <path fill="#2f8b88" d="M17.6 7.5H27v4.4h-4.8v1.8H26v4.2h-3.8v2.2H27v4.4H17.6z" />
        </svg>
        <div class="name">L <span class="amp">&</span> E</div>
        <div class="company">Construction Group</div>
        <div class="rule"></div>
        <div class="tag">Orange County Remodeling</div>
      </div>
    </div>
  </body>
</html>
