<!DOCTYPE html>
<html>
  <head>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body { background: #333; display: flex; gap: 16px; padding: 16px; align-items: end; }
      .cell { display: flex; flex-direction: column; gap: 6px; align-items: center; color: #aaa; font: 11px sans-serif; }
      img { display: block; image-rendering: pixelated; }
    </style>
  </head>
  <body>
    <div class="cell">
      <img src="favicon.svg" width="16" height="16" alt="16" />
      16
    </div>
    <div class="cell">
      <img src="favicon.svg" width="32" height="32" alt="32" />
      32
    </div>
    <div class="cell">
      <img src="favicon.svg" width="64" height="64" alt="64" />
      64
    </div>
  </body>
</html>
